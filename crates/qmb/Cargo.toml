[package]
name = "qmb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Quantum many-body algebra facade and examples"

[features]
default = ["normalize"]
normalize = ["dep:qmb-normalize"]
export = ["dep:qmb-export", "qmb-export/ndarray", "qmb-export/sprs"]
# Compatibility alias: normalization now uses std in qmb-normalize.
libm = ["normalize"]

[dependencies]
qmb-core.workspace = true
qmb-basic.workspace = true
qmb-geometry.workspace = true
qmb-spin-half.workspace = true
qmb-normalize = { workspace = true, optional = true }
qmb-export = { workspace = true, optional = true }

[dev-dependencies]
num-complex.workspace = true
num-traits.workspace = true
